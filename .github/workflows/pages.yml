name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  # ./demo.sh --publish starts this after updating the demo-video branch.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The walkthrough video lives on the demo-video branch (./demo.sh --publish), not on main.
      - name: Add the walkthrough video
        run: |
          if git fetch --depth 1 origin demo-video; then
            mkdir -p apps/playground/dist/demos
            git archive FETCH_HEAD demos | tar -x --strip-components=1 -C apps/playground/dist/demos
          else
            echo "No demo-video branch yet; deploying without a video."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    # Pages cannot publish from a private repo on the free plan; deploy once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
